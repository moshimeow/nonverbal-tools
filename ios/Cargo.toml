[package]
name = "speak-pocket"
version = "0.1.0"
edition = "2024"
default-run = "speak-pocket"

[dependencies]
anyhow = "1"
dioxus = { version = "=0.7.10" }
jieba-rs = { version = "=0.11.0", default-features = false }
loqui-g2p = "=0.4.0"
rodio = { version = "0.20", default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
sherpa-onnx = { version = "=2.0.0", default-features = false }
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "ios")'.dependencies]
dioxus = { version = "=0.7.10", features = ["mobile"] }

[target.'cfg(not(target_os = "ios"))'.dependencies]
dioxus = { version = "=0.7.10", features = ["desktop"] }

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3

[[bin]]
name = "speak-pocket"
path = "src/main.rs"

[[bin]]
name = "speech-check"
path = "src/bin/speech-check.rs"
